<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Criar</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<main class="page-center">

    <div class="form-card">

        <a href="/" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h1>Criar atividade</h1>

        <form action="/salvar" method="POST">

            <label for="materia">
                Matéria
            </label>

            <input type="text"
                   id="materia"
                   name="materia"
                   required>

            <label for="nome">
                Nome da atividade
            </label>

            <input type="text"
                   id="nome"
                   name="nome"
                   required>

            <label for="nota">
                Nota
            </label>

            <input type="number"
                   id="nota"
                   name="nota"
                   min="0"
                   max="100"
                   required>

            <label for="prazo">
                Prazo
            </label>

            <input type="date"
                   id="prazo"
                   name="prazo"
                   required>

            <div class="button-group">

                <button type="reset"
                        class="clear-btn">

                    Limpar

                </button>

                <button type="submit"
                        class="save-btn">

                    Salvar

                </button>

            </div>

        </form>

    </div>

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
